name: tiny-gpt-train

on:
  push:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Train
        run: python train.py --epochs 6 --batch_size 32

      - name: Upload checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: tiny-gpt-checkpoint
          path: checkpoints/tiny_gpt.pt
